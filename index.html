<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Subscription Confirmation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    .message {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Confirm Subscription</h2>

  <input type="email" id="email" placeholder="Enter your email" required>
  <input type="text" id="paymentRef" placeholder="Enter payment reference" required>

  <button onclick="submitSubscription()">Confirm Payment</button>

  <div class="message" id="message"></div>
</div>

<script>
  function submitSubscription() {
    const userEmail = document.getElementById("email").value;
    const paymentReference = document.getElementById("paymentRef").value;

    if (!userEmail || !paymentReference) {
      document.getElementById("message").innerText = "Please fill all fields.";
      return;
    }

    fetch("https://script.google.com/macros/s/AKfycbwKlDiPXmMluEZQa4SThMBWPJg2fwTiILzuNoOmpXOqd1Cgkx82HRKhKOLvOIgXw76vfA/exec", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: userEmail,
        payment_ref: paymentReference
      })
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById("message").innerText =
        "Subscription submitted. Waiting for approval.";
    })
    .catch(error => {
      document.getElementById("message").innerText =
        "Error submitting subscription.";
      console.error(error);
    });
  }
</script>

</body>
</html>
