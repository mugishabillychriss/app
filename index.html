<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Subscription Confirmation</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh; }
    .container { background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:300px; }
    h2 { text-align:center; }
    input { width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc; }
    button { width:100%; padding:10px; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#45a049; }
    .message { margin-top:10px; text-align:center; font-size:14px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Confirm Subscription</h2>
  <input type="email" id="email" placeholder="Enter your email" required>
  <input type="text" id="paymentRef" placeholder="Enter payment reference" required>
  <button onclick="submitSubscription()">Confirm Payment</button>
  <div class="message" id="message"></div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxhg7jQLVupemZCbGKF-mRBpFtDgIAJOqqszwcrmm5Lc23abLnABOs9tZ5iOrJOu5I0hA/exec"; // Replace with your /exec URL

function submitSubscription() {
  const userEmail = document.getElementById("email").value;
  const paymentReference = document.getElementById("paymentRef").value;
  const msg = document.getElementById("message");

  if (!userEmail || !paymentReference) {
    msg.innerText = "Please fill all fields.";
    return;
  }

  fetch('https://script.google.com/macros/s/AKfycbxhg7jQLVupemZCbGKF-mRBpFtDgIAJOqqszwcrmm5Lc23abLnABOs9tZ5iOrJOu5I0hA/exec', {
    method: "POST",
    body: JSON.stringify({ email: userEmail, payment_ref: paymentReference })
  })
  .then(res => res.text())
  .then(data => {
    msg.innerText = "Subscription submitted. Waiting for approval.";
  })
  .catch(error => {
    msg.innerText = "Error submitting subscription.";
    console.error(error);
  });
}

// Optional: check approval status
function checkStatus(email) {
  fetch(WEB_APP_URL + "?email=" + encodeURIComponent(email))
    .then(res => res.text())
    .then(status => {
      console.log("Current status:", status);
    });
}
</script>

</body>
</html>
